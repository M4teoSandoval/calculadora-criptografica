<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     role="img"
     aria-label="Candado con circuito, logo de la calculadora criptografica">

    <defs>
        <filter id="brillo" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="1.6" result="halo"/>
            <feMerge>
                <feMergeNode in="halo"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#00ff41"/>
            <stop offset="1" stop-color="#00a82b"/>
        </linearGradient>
    </defs>

    <!-- marco -->
    <rect x="2" y="2"
          width="60" height="60" rx="10"
          fill="#04140c"
          stroke="#00ff41"
          stroke-opacity="0.45"
          stroke-width="1.5"/>

    <!-- pistas del circuito -->
    <g stroke="#00ff41" stroke-opacity="0.35" stroke-width="1.2"
       fill="none">
        <path d="M8 16 h10"/>
        <path d="M46 16 h10"/>
        <path d="M8 48 h10"/>
        <path d="M46 48 h10"/>
        <path d="M16 8 v6"/>
        <path d="M48 8 v6"/>
        <path d="M16 50 v6"/>
        <path d="M48 50 v6"/>
    </g>

    <g fill="#00ff41" fill-opacity="0.55">
        <circle cx="6" cy="16" r="1.6"/>
        <circle cx="58" cy="16" r="1.6"/>
        <circle cx="6" cy="48" r="1.6"/>
        <circle cx="58" cy="48" r="1.6"/>
    </g>

    <!-- candado -->
    <g filter="url(#brillo)">
        <path d="M24 28 v-6 a8 8 0 0 1 16 0 v6"
              fill="none"
              stroke="url(#metal)"
              stroke-width="3.4"
              stroke-linecap="round"/>

        <rect x="18" y="27" width="28" height="23" rx="4"
              fill="none"
              stroke="url(#metal)"
              stroke-width="3"/>

        <circle cx="32" cy="35.5" r="2.9" fill="#00ff41"/>
        <rect x="30.6" y="35.5" width="2.8" height="8" rx="1.2"
              fill="#00ff41"/>
    </g>

    <!-- destello -->
    <path d="M6 12 l6 0 l-6 10 l6 0"
          fill="none"
          stroke="#22d3ee"
          stroke-opacity="0.5"
          stroke-width="1.4"
          stroke-linecap="round"/>
</svg>
